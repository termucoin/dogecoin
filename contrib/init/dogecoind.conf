description "NonceCash Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env NONCECASHD_BIN="/usr/bin/noncecashd"
env NONCECASHD_USER="noncecash"
env NONCECASHD_GROUP="noncecash"
env NONCECASHD_PIDDIR="/var/run/noncecashd"
# upstart can't handle variables constructed with other variables
env NONCECASHD_PIDFILE="/var/run/noncecashd/noncecashd.pid"
env NONCECASHD_CONFIGFILE="/etc/noncecash/noncecash.conf"
env NONCECASHD_DATADIR="/var/lib/noncecashd"

expect fork

respawn
respawn limit 5 120
kill timeout 60

pre-start script
    # this will catch non-existent config files
    # noncecashd will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$NONCECASHD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run noncecashd."
        echo "The setting must appear in $NONCECASHD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following"
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is also recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"NonceCash Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$NONCECASHD_PIDDIR"
    chmod 0755 "$NONCECASHD_PIDDIR"
    chown $NONCECASHD_USER:$NONCECASHD_GROUP "$NONCECASHD_PIDDIR"
    chown $NONCECASHD_USER:$NONCECASHD_GROUP "$NONCECASHD_CONFIGFILE"
    chmod 0660 "$NONCECASHD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$NONCECASHD_PIDFILE" \
    --chuid $NONCECASHD_USER:$NONCECASHD_GROUP \
    --exec "$NONCECASHD_BIN" \
    -- \
    -pid="$NONCECASHD_PIDFILE" \
    -conf="$NONCECASHD_CONFIGFILE" \
    -datadir="$NONCECASHD_DATADIR" \
    -disablewallet \
    -daemon

